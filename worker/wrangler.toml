# Cloudflare Worker for Pool LNH (free plan). Setup steps: worker/README.md.
# Nothing secret here: GH_TOKEN and VAPID_PRIVATE_JWK are stored with `npx wrangler secret put`.
name = "pool-lnh"
main = "src/index.js"
compatibility_date = "2025-09-01"

[triggers]
crons = ["* * * * *"]          # every minute; src/index.js decides what to do from the Toronto time

[[kv_namespaces]]
binding = "KV"
id = "7af9238b3a0c45d78f1b37ce327c22e1"     # printed by: npx wrangler kv namespace create pool-lnh

[vars]
REPO = "tomy-dostie/pool-reports"
SITE = "https://tomy-dostie.github.io/pool-reports/"
ORIGIN = "https://tomy-dostie.github.io"
POOLERS = "tomy,vinny,gab,vallee,flo,yves,rej,charlene,denis,jeff"
VAPID_SUBJECT = "https://tomy-dostie.github.io/pool-reports/"
VAPID_PUBLIC = "BBRaBoDxHVv5ACrf1FsKuF1hVzTRbG6e_YgobXg6fIPa1BI9yIKc1Pr_h4J4LJEElHX1cNwnlFPpsMuqa9fST_0"   # printed by: node scripts/vapid.mjs
