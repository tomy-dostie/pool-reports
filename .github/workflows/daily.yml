# Rapport quotidien : runs every morning, builds the page and publishes it on GitHub Pages.
# Actions are pinned to exact commits (the comment shows the version) so a hijacked tag cannot change what runs here.
name: Rapport quotidien

on:
  schedule:
    - cron: "0 9 * * *"      # 09:00 UTC = 5 h (summer) / 4 h (winter) in Toronto, after the last games end
  workflow_dispatch:           # lets you start it by hand from the Actions tab
  push:
    branches: [main]

# Nothing gets write access unless a job asks for it below.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Separate job so a failing test shows as a red X, without blocking the morning page.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: "3.12"
      - name: Tests
        shell: bash
        run: |
          pip install -q pytest
          set -o pipefail
          # On failure, turn the failing test names and assertion lines into annotations (visible on the run page).
          python -m pytest -q tests -rf --tb=short 2>&1 | tee pytest.txt || {
            grep -E "^(FAILED|ERROR)|^E  " pytest.txt | head -30 | sed 's/^/::error title=pytest::/'
            exit 1
          }

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: "3.12"

      # Finished games never change, so they are kept between runs instead of downloaded again.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830   # v4
        with:
          path: cache
          key: nhl-cache-${{ github.run_id }}
          restore-keys: nhl-cache-

      - name: Compare with the PoolExpert numbers (information only)
        continue-on-error: true
        run: python -m pool check

      - name: Build the page
        env:
          REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m pool build --out site --preview site/apercu

      - name: Keep downloaded games for next time
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830   # v4
        with:
          path: cache
          key: nhl-cache-${{ github.run_id }}

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b   # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa   # v3
        with:
          path: site

      # Optional: only does something if you added the DISCORD_WEBHOOK or TELEGRAM_* secrets.
      - name: Post the summary to the group chat
        if: github.event_name == 'schedule'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: python -c "from pool.notify import send; print('sent:', send(open('site/summary.txt', encoding='utf-8').read()))"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e   # v4
