# En direct : during game nights, rebuilds the page with tonight's points so far (provisional).
# Started by the Cloudflare Worker (worker/) when the NHL scoreboard changed (GitHub's own schedule was too
# throttled to rely on). A quick check still compares with the live.json online; the page is rebuilt and deployed
# only when something changed (a goal, a period, a game starting or ending).
# Actions are pinned to exact commits (same versions as daily.yml).
name: En direct

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    env:
      REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      # public values (repository variables) for the notifications panel; empty = no panel
      PUSH_URL: ${{ vars.PUSH_URL }}
      VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: "3.12"

      - name: Anything new tonight?
        id: check
        run: python -m pool live-check

      - if: steps.check.outputs.changed == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830   # v4
        with:
          path: cache
          key: nhl-cache-${{ github.run_id }}
          restore-keys: nhl-cache-

      - name: Build the page with tonight's points
        if: steps.check.outputs.changed == 'true'
        run: python -m pool build --live --out site --classic site/classique

      - name: Keep downloaded games for next time
        if: steps.check.outputs.changed == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830   # v4
        with:
          path: cache
          key: nhl-cache-${{ github.run_id }}

      - if: steps.check.outputs.changed == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b   # v5
      - if: steps.check.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa   # v3
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e   # v4
